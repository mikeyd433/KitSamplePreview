[package]
name = "kitbench-spike"
version = "0.0.0"
description = "Kitbench Phase 0 drag-out spike (throwaway)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "kitbench_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Already in the tree via drag-rs. Named explicitly so `check_paths` can show the
# exact string drag-rs will hand to the shell -- it canonicalizes with dunce.
dunce = "1"
